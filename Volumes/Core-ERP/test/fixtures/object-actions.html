<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object Actions UI fixture</title><link rel="stylesheet" href="/public/style.css"><style>body{height:auto;min-height:100vh;overflow:auto}main{padding:24px;width:100%;max-width:1100px;margin:auto}.fixture-editor{margin-top:24px}.fixture-editor .record-editor-header{min-height:72px}.fixture-toolbar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}.fixture-toolbar label{display:flex;gap:8px;align-items:center}.fixture-toolbar select{width:auto}#fixture-capture{margin-top:24px}</style></head><body><main><h1>Object Actions</h1><p>UI verification fixture · Illustrative data</p><div class="fixture-toolbar"><label>Example<select id="fixture-class"><option value="subledger_account">Sub-ledger</option><option value="accounting_object">Accounting object</option></select></label><label>Delay response<select id="fixture-delay"><option value="0">No delay</option><option value="600">600ms</option></select></label></div><section class="panel"><div class="panel-head"><h2>Assets</h2></div><div id="fixture-grid"></div></section><form id="account-form" class="panel fixture-editor"><button type="button" class="panel-close" aria-label="Close asset panel" onclick="this.closest('form').hidden=true">x</button><header class="record-editor-header"><h2>Edit asset</h2><p>Sub Ledger / Asset</p></header><p id="fixture-object-label"></p><div class="actions"><button type="button" disabled>Save account</button></div></form><form id="accounting-object-form" class="panel fixture-editor" hidden><button type="button" class="panel-close" aria-label="Close project panel" onclick="this.closest('form').hidden=true">x</button><header class="record-editor-header"><h2>Edit project</h2><p>Accounting Object / Project</p></header><p>PRJ-001 · Riverside Development</p><div class="actions"><button type="button" disabled>Save Object</button></div></form><section id="fixture-capture" class="panel" hidden><h2>Transaction Capture</h2><p id="fixture-capture-context"></p><div id="fixture-capture-lines"></div></section><p id="fixture-status" role="status"></p></main><script src="/public/object-grid-views.js"></script><script src="/public/object-actions.js"></script><script>
const state={orgId:'org',divisionId:'division'};const types={subledger_account:{object_type_id:'asset',code:'AST-',name:'Delivery vehicle',type:'Asset'},accounting_object:{object_type_id:'project',code:'PRJ-',name:'Riverside Development',type:'Project'}};let manager;
const definitions=[{transaction_line_definition_id:'first',line_order:1,line_description:'Object credited',subledger_requirement:'mandatory',subledger_account_type_id:'asset',object_requirements:[{accounting_object_type_id:'project',value_behaviour:'captured'}]},{transaction_line_definition_id:'second',line_order:2,line_description:'Object debited',subledger_requirement:'mandatory',subledger_account_type_id:'asset',occurrence:'optional',object_requirements:[{accounting_object_type_id:'project',value_behaviour:'captured'}]}];
function selection(number=1){const kind=document.getElementById('fixture-class').value,t=types[kind];return {kind,objectId:'record'+number,typeId:t.object_type_id,code:t.code+String(number).padStart(3,'0'),name:number===1?t.name:kind==='subledger_account'?'Warehouse equipment':'Warehouse expansion'};}
async function api(url){const q=new URLSearchParams(url.split('?')[1]),s=selection(Number(q.get('object_id').slice(6)));await new Promise(resolve=>setTimeout(resolve,Number(document.getElementById('fixture-delay').value)));const object={object_id:s.objectId,object_type_id:s.typeId,object_code:s.code,object_name:s.name};const lines=definitions.map((d,i)=>({transaction_line_definition_id:d.transaction_line_definition_id,line_description:d.line_description,debit_credit:i?'debit':'credit',account_code:'1500',account_name:'Fixed assets'}));const all=[{transaction_type_id:'single',type_name:'Asset acquisition',type_description:'Record an acquisition',lines:[lines[0]]},{transaction_type_id:'multiple',type_name:'Asset transfer',type_description:'Transfer allocation between objects',lines}];return {object,source_division_id:'division',transactions:q.get('transaction_type_id')?all.filter(t=>t.transaction_type_id===q.get('transaction_type_id')):all};}
function table(target,columns,rows,onOpen){target.classList.add('grid-wrap');target.replaceChildren();const t=document.createElement('table');t.className='data-grid';const head=t.createTHead().insertRow();columns.forEach(([caption])=>{const th=document.createElement('th');th.textContent=caption;head.append(th);});const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();tr.onclick=()=>onOpen(row);columns.forEach(([,value])=>{const cell=tr.insertCell(),content=value(row);if(content instanceof Node)cell.append(content);else cell.textContent=content;});});target.append(t);}
function editor(s){const prefix=s.kind==='subledger_account'?'account':'accounting-object';document.getElementById('account-form').hidden=prefix!=='account';document.getElementById('accounting-object-form').hidden=prefix!=='accounting-object';document.getElementById('fixture-object-label').textContent=s.code+' · '+s.name;manager.editor(prefix,s);}
manager=erpObjectActions.create({api,context:()=>state,openStatement:async s=>{document.getElementById('fixture-status').textContent='Statement opened for '+s.objectId;},openTransaction:async s=>{const createLine=d=>({transaction_line_definition_id:d.transaction_line_definition_id,accounting_objects:[],subledger_account_id:'',debit_amount:'',credit_amount:''});const lines=erpObjectActions.prepareLines({definitions,lines:[createLine(definitions[0])],kind:s.kind,object:s.object,definitionId:s.definitionId,createLine});document.getElementById('fixture-capture').hidden=false;document.getElementById('fixture-capture-context').textContent=s.transaction.type_name+' · '+s.object.object_code+' / '+s.object.object_name;table(document.getElementById('fixture-capture-lines'),[['Line',r=>r.transaction_line_definition_id],['Selected object',r=>r.subledger_account_id||r.accounting_objects[0]?.accounting_object_id||'Choose value']],lines,()=>{});},notify:message=>document.getElementById('fixture-status').textContent=message});
function render(){manager.close();const rows=[selection(1),selection(2)];erpObjectGridViews.render({target:document.getElementById('fixture-grid'),toolbar:document.querySelector('.panel-head'),contextKey:document.getElementById('fixture-class').value,columns:[['Code',r=>r.code],['Name',r=>r.name],['Actions',r=>manager.button(r)]],rows,table,onOpen:editor,code:r=>r.code,name:r=>r.name,workflowButton:()=>{const s=document.createElement('span');s.textContent='Active';return s;},actionButton:r=>manager.button(r),statuses:[],steps:[],workflowPath:()=>null,beforeChange:()=>manager.close()});editor(rows[0]);}
document.getElementById('fixture-class').onchange=render;render();
</script></body></html>
