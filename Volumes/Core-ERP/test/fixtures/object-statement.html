<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object Statement UI fixture</title><link rel="stylesheet" href="/public/style.css"></head><body>
<main style="padding:20px;width:100%;max-width:1100px;margin:auto"><h1>Object Statement</h1><p>UI verification fixture · Illustrative data</p><button type="button" id="reports-entry">Reports → Object Statement</button>
<section class="panel"><h2>Record entry points</h2><form id="account-form"><input id="account-id" type="hidden" value="record"><select id="account-type"><option value="type">Customer</option></select><div class="actions"></div></form><form id="accounting-object-form"><input id="accounting-object-id" type="hidden" value="record"><input id="accounting-object-type" type="hidden" value="type"><div class="actions"></div></form><form id="accounting-dimension-form"><input id="accounting-dimension-id" type="hidden" value="record"><input id="accounting-dimension-type" type="hidden" value="type"><div class="actions"></div></form></section>
<section class="panel"><div id="report-result"></div></section><form id="journal-form" hidden><h2>Posted journal detail</h2><div class="actions"></div></form><p id="errors" role="alert"></p></main>
<script src="/public/currency-format.js"></script><script src="/public/object-statement.js"></script><script>
const state={orgId:'org'};let controller;const classMeta={subledger_account:['subledger_account_type_id','subledger_account_id','account_code','account_name','Customer'],accounting_object:['accounting_object_type_id','accounting_object_id','object_code','object_name','Project'],accounting_dimension:['accounting_dimension_type_id','accounting_dimension_id','dimension_code','dimension_name','Region']};
async function api(url){const [path,search]=url.split('?'),q=new URLSearchParams(search),kind=q.get('object_class')||document.getElementById('statement-class').value,m=classMeta[kind];if(path==='gl-accounts/list')return {gl_accounts:[{gl_account_id:'gl',account_code:'5100',account_name:'Materials'}]};if(path.endsWith('/types')||path==='subledger-account-types/list')return {types:[{[m[0]]:'type',type_name:m[4],is_active:true}],subledger_account_types:[{[m[0]]:'type',type_name:m[4],is_active:true}]};if(path.endsWith('/list')){const rows=[{[m[1]]:'record',[m[2]]:'PRJ-001',[m[3]]:'Riverside Development'}];return {records:rows,subledger_accounts:rows};}
const children=kind==='accounting_object'&&q.get('include_child_objects')==='1';return {object_class_label:{accounting_object:'Accounting Object',subledger_account:'Sub Ledger',accounting_dimension:'Accounting Dimension'}[kind],object:{object_code:'PRJ-001',object_name:'Riverside Development',organisation_name:'Riverside Holdings',type_name:m[4]},currency_code:'ZAR',date_from:q.get('date_from'),date_to:q.get('date_to'),include_child_objects:children,opening_balance:'15000.00',period_debit:children?'32500.00':'8500.00',period_credit:'0.00',closing_balance:children?'47500.00':'23500.00',restricted:false,total_count:children?2:1,offset:0,next_offset:null,rows:[...(children?[{journal_id:'j1',journal_number:'JRN-00481',journal_date:'2026-09-03',description:'Building materials',transaction_heading:'Construction materials purchase',allocated_objects:'PRJ-001.01 · Construction',gl_account_code:'5100',gl_account_name:'Materials',debit_amount:'24000.00',credit_amount:'0.00',running_balance:'39000.00'}]:[]),{journal_id:'j2',journal_number:'JRN-00496',journal_date:'2026-09-08',description:'Architect fees',transaction_heading:'Architect service invoice',allocated_objects:'PRJ-001 · Riverside Development',gl_account_code:'5200',gl_account_name:'Professional fees',debit_amount:'8500.00',credit_amount:'0.00',running_balance:children?'47500.00':'23500.00'}]};}
async function openReport(_report,selection){document.getElementById('journal-form').hidden=true;await controller.prepare(selection);}controller=window.createObjectStatement({api,downloadReportCsv:(filename,columns,rows)=>{window.statementCsv={filename,columns:columns.map(([label,value])=>({label,values:rows.map(value)}))};},context:()=>state,openReport,openJournal:async()=>{controller.hide();document.getElementById('journal-form').hidden=false;},formatMoney:value=>CurrencyFormat.format(value,{currency_code:'ZAR'}),notify:message=>document.getElementById('errors').textContent=message});['account','accounting-object','accounting-dimension'].forEach(p=>controller.editor(p,true,'type'));document.getElementById('reports-entry').onclick=()=>openReport('object_statement');openReport('object_statement',{kind:'accounting_object',typeId:'type',objectId:'record'});
</script></body></html>
